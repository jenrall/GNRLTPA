settings:
  request-timeout-seconds: 60
  cooldown-seconds: 10
  teleport-delay-seconds: 3
  cancel-on-move: true

messages:
  prefix: "<gold>[GNRLTPA] <reset>"
  no-permission: "<red>You don't have permission.</red>"
  player-not-found: "<red>Player not found.</red>"
  self-request: "<red>You can't send a request to yourself.</red>"
  request-sent: "<green>Request sent to <yellow><player></yellow>.</green>"
  request-received: "<yellow><player></yellow> <green>wants to teleport to you.</green>"
  request-denied: "<red><player> denied your request.</red>"
  no-pending-request: "<red>You have no pending request.</red>"
  teleporting: "<green>Teleporting in <yellow><seconds></yellow> seconds...</green>"
  teleported: "<green>Teleported successfully.</green>"
  teleport-cancelled: "<red>✖ Teleport cancelled (you moved).</red>"   # ← جدید
  cooldown: "<red>Please wait before sending another request.</red>"
  already-pending: "<red>That player already has a pending request.</red>"
  tpa-disabled: "<red>That player has TPA disabled.</red>"
  tpa-toggled-on: "<green>✔ TPA requests are now <yellow>ENABLED</yellow>.</green>"
  tpa-toggled-off: "<red>✖ TPA requests are now <yellow>DISABLED</yellow>.</red>"
  blocked-player: "<yellow>✔ You blocked <player>.</yellow>"
  unblocked-player: "<yellow>✔ You unblocked <player>.</yellow>"
  you-are-blocked: "<red>That player has blocked you.</red>"
  reloaded: "<green>✔ Config reloaded.</green>"
  auto-allow-on: "<green>✔ Auto-Accept <yellow>ENABLED</yellow>.</green>"   # ← جدید
  auto-deny-on: "<red>✔ Auto-Deny <yellow>ENABLED</yellow>.</red>"          # ← جدید
  auto-ask-on: "<gray>✔ Auto mode <yellow>DISABLED</yellow> (ask).</gray>"  # ← جدید

gui:
  title-tpa: "✦ TPA Menu ✦"
  title-tpahere: "✦ TPAHere Menu ✦"
  rows: 6

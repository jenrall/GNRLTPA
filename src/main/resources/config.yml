settings:
  request-timeout-seconds: 60
  cooldown-seconds: 10
  teleport-delay-seconds: 3
  cancel-on-move: true

messages:
  prefix: "<gold>[GNRLTPA]</gold> <reset>"
  no-permission: "<red>You don't have permission.</red>"
  player-not-found: "<red>Player not found.</red>"
  self-request: "<red>You can't send a request to yourself.</red>"
  request-sent: "<green>Request sent to <yellow><player></yellow>.</green>"
  request-received: "<yellow><player></yellow> <green>wants to teleport to you.</green>"
  request-accepted: "<green><player> accepted your request.</green>"
  request-denied: "<red><player> denied your request.</red>"
  no-pending-request: "<red>You have no pending request.</red>"
  teleporting: "<green>Teleporting in <yellow><seconds></yellow> seconds...</green>"
  teleport-cancelled: "<red>Teleport cancelled because you moved.</red>"
  teleported: "<green>Teleported successfully.</green>"

gui:
  menu-title: "<dark_gray>TPA Menu"
  menu-rows: 3
  previous-page-item: ARROW
  next-page-item: ARROW
  player-head-item: PLAYER_HEAD

name: GNRLTPA
version: 1.0.0
main: com.gnrl.tpa.GNRLTPA
api-version: '1.21'
description: Modern TPA plugin by GNRLFlawless
author: GNRLFlawless
authors: [GNRLFlawless]
website: https://github.com/jenrall/GNRLTPA
softdepend: [PlaceholderAPI]

commands:
  tpa:
    description: Send a teleport request
    usage: /tpa [player]
  tpahere:
    description: Request someone to teleport to you
    usage: /tpahere [player]
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
  tpacancel:
    description: Cancel your sent request
    usage: /tpacancel
  tpauto:
    description: Toggle auto-accept
    usage: /tpauto
  tptoggle:
    description: Toggle receiving TPA requests
    usage: /tptoggle
  tpblock:
    description: Block a player from sending TPA
    usage: /tpblock <player>
  tpreload:
    description: Reload the plugin config
    usage: /tpreload

permissions:
  gnrltpa.use:
    default: true
  gnrltpa.admin:
    default: op

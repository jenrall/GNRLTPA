name: GNRLTPA
version: 1.0.0
main: com.gnrl.tpa.GNRLTPA
api-version: '1.21'
description: Modern TPA plugin with GUI menu
author: GNRL

commands:
  tpa:
    description: Send a teleport request
    usage: /tpa <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
  tpmenu:
    description: Open TPA menu
    usage: /tpmenu

permissions:
  gnrltpa.use:
    default: true
